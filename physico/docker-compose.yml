version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: physioedvance_postgres
    restart: always
    environment:
      POSTGRES_USER: physio_user
      POSTGRES_PASSWORD: physio_pass
      POSTGRES_DB: physioedvance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio_user -d physioedvance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: physioedvance_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: physioedvance_api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://physio_user:physio_pass@postgres:5432/physioedvance_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_access_key_physioedvance_2026
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_physioedvance_2026
      FACE_VERIFICATION_PROVIDER: mock
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: physioedvance_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
